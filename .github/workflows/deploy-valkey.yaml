name: Deploy Valkey

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy Valkey til ${{ matrix.miljo }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        miljo: ${{ fromJSON(github.ref_name == 'main' && '["dev-gcp", "prod-gcp"]' || '["dev-gcp"]') }}
    concurrency:
      group: deploy-valkey-${{ matrix.miljo }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
      - name: Apply Valkey-manifest
        env:
          MILJO: ${{ matrix.miljo }}
        run: |
          nais apply nais/valkey.yaml --team flex --environment "$MILJO"
          for forsoek in {1..30}; do
            instanser=$(nais valkey list --team flex --environment "$MILJO" --output json)
            if echo "$instanser" | jq -e 'any(.[]; .Name == "sykmeldinger-identer" and .State == "RUNNING")' >/dev/null; then
              echo "Valkey er klar i $MILJO"
              exit 0
            fi
            echo "Venter på Valkey i $MILJO ($forsoek/30)"
            sleep 10
          done
          echo "Valkey ble ikke klar i $MILJO" >&2
          exit 1
